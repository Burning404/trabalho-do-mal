<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LANCHES - RESENHAS</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    
    <header>
        <div class="logo">
            <div class="logo-icon">🍴</div>
            <span>Botao do lanche</span>
        </div>
    </header>


    
    <main>

        
        <div class="login-box">

            <div class="login-icon">🍴</div>

            <h1>Lanches</h1>

            <p class="subtitle">
                Entre na sua conta para resenhar
            </p>


            
            <form>

                <label for="email">
                    E-mail ou não?
                </label>

                <input
                    type="text"
                    id="email"
                    placeholder="email.email.com email?"
                >


                <label for="senha">
                    Senha
                </label>

                <input
                    type="password"
                    id="senha"
                    placeholder="•••••••• (a senha é secreta shhhh)"
                >


                
                <div class="options"> 

                    <label class="remember">
                        <input type="checkbox">
                        <span>eu lembro de voce?</span>
                    </label>

                    <a href="#">
                        Esqueceu denovo? NAO clica aqui
                    </a>

                </div>


                
                <button type="submit">
                    Botao do lanche →
                </button>

            </form>


            
            <div class="create-account">

                <span>
                    Ainda não tem resenha?
                </span>

                <a href="#">
                    Criar resenha, se quiser ne (nao ve a ultima parte do codigo)
                </a>

            </div>

        </div>

    </main>


    
    <footer>
        © 2026 Botao dos lanches Ambiente de Resenha e Comida Web.
    </footer>

</body>

</html>
